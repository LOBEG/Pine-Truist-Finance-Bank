name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinebank_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Migrate database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pinebank_test
          DATABASE_SSL: disable
        run: npm run migrate

      - name: Unit tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pinebank_test
          DATABASE_SSL: disable
          REDIS_URL: redis://localhost:6379
        run: npm test

      - name: Reconcile ledger
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pinebank_test
          DATABASE_SSL: disable
        run: npm run reconcile-ledger

      - name: npm audit (high+)
        run: npm audit --audit-level=high || true

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only validate Docker builds on main/staging pushes (not every PR to save minutes)
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - core-banking-api
          - admin-api
          - realtime-gateway
          - fraud-engine
          - audit-worker
          - notification-worker
          - transaction-worker
          - scheduler
          - web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          # Inline cache keeps layer caches between runs without a registry
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: pine/${{ matrix.service }}:ci
