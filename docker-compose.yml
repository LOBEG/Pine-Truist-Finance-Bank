# ============================================================
# Pine Bank — docker-compose.yml
# Production-parity local stack.
#
# Usage:
#   docker compose --env-file .env up --build
#
# All services share the 'pine' network. Services communicate
# via their service names (e.g. http://core-banking-api:8080).
#
# NOTE: This stack is Postgres-native. All job queues, pub/sub,
# rate limiting, and socket coordination use Postgres instead of
# Redis. This simplifies infrastructure and operations.
# ============================================================

version: '3.9'

# ---- Shared defaults ----------------------------------------
x-service-defaults: &service-defaults
  restart: on-failure
  networks:
    - pine
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

# ---- Build context (all services share the monorepo root) ---
x-build-defaults: &build-defaults
  context: .

# ============================================================
services:
  # ---- Infrastructure ------------------------------------------

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pine_dev_secret}
      POSTGRES_DB: pinebank
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pine -d pinebank']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---- Migration runner (exits after completion) ---------------

  migrator:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/core-banking-api/Dockerfile
    command: ['node', 'db/cli.js', 'migrate']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ---- API Services --------------------------------------------

  api-gateway:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - '80:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      SERVICE_NAME: api-gateway
      LOG_LEVEL: info
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
      CORE_BANKING_URL: http://core-banking-api:8080
      ADMIN_API_URL: http://admin-api:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_TRUST_PROXY: 'true'
    depends_on:
      - core-banking-api
      - admin-api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  core-banking-api:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/core-banking-api/Dockerfile
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      SERVICE_NAME: core-banking-api
      LOG_LEVEL: info
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 20
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      JWT_ISSUER: pine-bank
      JWT_AUDIENCE: pine-bank-clients
      JWT_ACCESS_TTL_SECONDS: 600
      JWT_REFRESH_TTL_SECONDS: 2592000
      ENCRYPTION_KEK_B64: ${ENCRYPTION_KEK_B64}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-api:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/admin-api/Dockerfile
    ports:
      - '8081:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      SERVICE_NAME: admin-api
      LOG_LEVEL: info
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      JWT_ISSUER: pine-bank
      JWT_AUDIENCE: pine-bank-clients
      JWT_ACCESS_TTL_SECONDS: 600
      ENCRYPTION_KEK_B64: ${ENCRYPTION_KEK_B64}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      RATE_LIMIT_TRUST_PROXY: 'true'
    depends_on:
      core-banking-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  realtime-gateway:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/realtime-gateway/Dockerfile
    ports:
      - '8082:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      SERVICE_NAME: realtime-gateway
      LOG_LEVEL: info
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      JWT_ISSUER: pine-bank
      JWT_AUDIENCE: pine-bank-clients
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Background Workers --------------------------------------

  fraud-engine:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/fraud-engine/Dockerfile
    environment:
      NODE_ENV: production
      SERVICE_NAME: fraud-engine
      LOG_LEVEL: info
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  audit-worker:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/audit-worker/Dockerfile
    environment:
      NODE_ENV: production
      SERVICE_NAME: audit-worker
      LOG_LEVEL: info
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  notification-worker:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/notification-worker/Dockerfile
    environment:
      NODE_ENV: production
      SERVICE_NAME: notification-worker
      LOG_LEVEL: info
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:-no-reply@pinebank.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  transaction-worker:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/transaction-worker/Dockerfile
    environment:
      NODE_ENV: production
      SERVICE_NAME: transaction-worker
      LOG_LEVEL: info
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  scheduler:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/scheduler/Dockerfile
    environment:
      NODE_ENV: production
      SERVICE_NAME: scheduler
      LOG_LEVEL: info
      TZ: America/New_York
      DATABASE_URL: postgres://pine:${POSTGRES_PASSWORD:-pine_dev_secret}@postgres:5432/pinebank
      DATABASE_SSL: disable
    deploy:
      # Scheduler must be a singleton — never scale beyond 1 replica
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # ---- Frontend ------------------------------------------------

  web:
    <<: *service-defaults
    build:
      <<: *build-defaults
      dockerfile: apps/web/Dockerfile
      args:
        PINE_API_URL: ${PINE_API_URL:-/api/v1}
        PINE_REALTIME_URL: ${PINE_REALTIME_URL:-}
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api-gateway

# ============================================================
volumes:
  postgres_data:
    driver: local

networks:
  pine:
    driver: bridge
